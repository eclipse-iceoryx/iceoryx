name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code-review-bot/requirements.txt

      - name: Run code review orchestrator
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p .review-results
          python3 code-review-bot/src/review_orchestrator.py \
            --repo . \
            --config code-review-bot/review-config.yaml \
            --pr-base "${{ github.event.pull_request.base.ref }}" \
            --pr-head "${{ github.event.pull_request.head.ref }}" \
            --output .review-results/review-results.json

      - name: Post GitHub report and comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTIONS: 'true'
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 code-review-bot/src/github_reporter.py \
            --results .review-results/review-results.json \
            --post-check \
            --post-comments \
            --generate-report \
            --output .review-results/review-report.md \
            --upload-sarif .review-results/review-results.sarif || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-review-report
          path: .review-results/
